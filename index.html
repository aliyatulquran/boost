<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<title>Aliyatul Quran Marketing Plan (offline)</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root{--bg:#f6f4ef;--card:#fff;--ink:#23302b;--mut:#66756e;--acc:#2f6f5e;--acc2:#e3efe9;--line:#e2dfd6;--warn:#fff7e0;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#161c19;--card:#1f2723;--ink:#e8eeea;--mut:#9aaba3;--acc:#6fc2a8;--acc2:#24362f;--line:#2e3a35;--warn:#3a3420}}
:root[data-theme="dark"]{--bg:#161c19;--card:#1f2723;--ink:#e8eeea;--mut:#9aaba3;--acc:#6fc2a8;--acc2:#24362f;--line:#2e3a35;--warn:#3a3420}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
#app{max-width:640px;margin:0 auto;padding:16px 14px 96px}
h1{font-size:1.25rem;margin:4px 0 2px}h2{font-size:1rem;margin:20px 0 8px;color:var(--mut);font-weight:600;letter-spacing:.02em}
.sub{color:var(--mut);font-size:.9rem;margin:0 0 12px}
.tabs{display:flex;gap:6px;margin:10px 0 14px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:4px}
.tabs button{flex:1;border:0;background:none;color:var(--mut);padding:10px 2px;border-radius:10px;font:inherit;font-size:.8rem;cursor:pointer}
.tabs button.on{background:var(--acc);color:#fff;font-weight:600}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:6px 12px;margin-bottom:10px}
.bar{height:8px;background:var(--acc2);border-radius:9px;overflow:hidden;margin:6px 0 4px}.bar i{display:block;height:100%;background:var(--acc);transition:width .3s}
.prog{display:flex;justify-content:space-between;font-size:.88rem;color:var(--mut)}
.row{display:flex;gap:12px;align-items:flex-start;padding:12px 2px;border-bottom:1px solid var(--line);cursor:pointer}
.row:last-child{border-bottom:0}
.row input{width:24px;height:24px;margin:1px 0 0;accent-color:var(--acc);flex:none}
.tx{flex:1}.tx small{display:block;color:var(--mut);font-size:.8rem}
.row.d .tx{text-decoration:line-through;color:var(--mut)}
.x{border:1px solid var(--line);background:none;color:var(--mut);border-radius:8px;padding:4px 8px;font-size:.78rem;cursor:pointer}
.btn{border:0;background:var(--acc);color:#fff;border-radius:12px;padding:13px 16px;font:inherit;font-weight:600;cursor:pointer;width:100%}
.btn.alt{background:var(--acc2);color:var(--ink)}
.link{background:none;border:0;color:var(--acc);font:inherit;font-size:.88rem;cursor:pointer;padding:6px 0}
textarea,input[type=text],input[type=password],select{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px;margin:4px 0 8px}
textarea{min-height:76px;resize:vertical}
.empty{color:var(--mut);padding:12px 2px;font-size:.92rem}
.fab{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--acc);color:#fff;border:0;border-radius:30px;padding:14px 20px;font:inherit;font-weight:600;box-shadow:0 4px 14px rgba(0,0,0,.25);cursor:pointer}
.note{background:var(--warn);border-radius:10px;padding:8px 12px;font-size:.88rem;margin-bottom:10px}
.focus{background:var(--card);border:2px solid var(--acc);border-radius:18px;padding:22px 18px;text-align:center;margin:8px 0}
.focus .big{font-size:1.3rem;font-weight:650;margin:10px 0 4px}
.focus p{color:var(--mut);margin:4px 0 16px}
.focus .btn{margin-bottom:8px}
.nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.nav button{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:8px 14px;font:inherit;cursor:pointer}
.stat{display:flex;justify-content:space-between;padding:10px 2px;border-bottom:1px solid var(--line)}.stat:last-child{border-bottom:0}
.log{padding:8px 2px;border-bottom:1px solid var(--line);font-size:.92rem}.log:last-child{border-bottom:0}.log b{color:var(--mut);font-weight:600;margin-right:6px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:84px;background:#333;color:#fff;padding:10px 16px;border-radius:10px;font-size:.9rem}
</style></head><body><div id="app"></div>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pad=n=>String(n).padStart(2,"0");
const ymd=d=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const addDays=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x};
const now=new Date(),TODAY=ymd(now),WEEK=ymd(addDays(now,-now.getDay())),MO=TODAY.slice(0,7);
const WOM=Math.min(4,Math.ceil(now.getDate()/7));
const DAYS=["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
const MONTHS=["January","February","March","April","May","June","July","August","September","October","November","December"];
const mlabel=m=>MONTHS[+m.slice(5)-1]+" "+m.slice(0,4);
const TPL={
daily:[
{id:"d_enq",t:"Reply to enquiries (WhatsApp, Telegram, DMs)",m:20},
{id:"d_post",t:"Post or story on social media",m:15},
{id:"d_clip",t:"Capture one photo or short clip",m:10}],
weekly:[
{id:"w_follow",t:"Follow up open enquiries and trial leads",m:30,day:0},
{id:"w_pay",t:"Payment reminders and fee follow-up",m:30,day:0},
{id:"w_out",t:"Outreach: 10 messages to Muslim business owners or masajid",m:45,day:1},
{id:"w_track",t:"Update the student tracking workbook",m:30,day:1},
{id:"w_take",t:"Create one student takeover content piece",m:60,day:2},
{id:"w_plan",t:"Plan and schedule next week's posts",m:45,day:3},
{id:"w_lg",t:"Check the LaunchGood campaign and share an update",m:20,day:4},
{id:"w_owner",t:"Send the owner a short weekly update",m:15,day:4}],
monthly:[
{id:"m_fund",t:"Review fundraising against the monthly target",wk:1},
{id:"m_prog",t:"Update programme details (Al-Bi'that intakes, fees, dates)",wk:1},
{id:"m_print",t:"Refresh leaflets and flyers for upcoming programmes",wk:2},
{id:"m_inst",t:"Expand institutional outreach (UK, US, Canada, Australia)",wk:3},
{id:"m_fin",t:"Review fees collected and the budget",wk:3},
{id:"m_stats",t:"Review results: reach, enquiries, enrolments",wk:4},
{id:"m_cal",t:"Draft next month's content calendar",wk:4},
{id:"m_rep",t:"Send the owner the monthly report",wk:4}]};
const S={done:{},custom:[],hidden:{},focus:{},tab:"today",vm:MO,can:true,live:false,one:false,skip:{},edit:false,adding:false,pending:false,toast:"",steps:null,stTitle:"",splitting:false,ai:{p:"paste",u:"",m:"",k:""},paste:false,pr:"",pt:""};
const LS="aliyatul_plan_v1";
function load(){try{const o=JSON.parse(localStorage.getItem(LS)||"{}");["done","custom","hidden","focus","ai"].forEach(k=>{if(o[k])S[k]=o[k]})}catch(e){}}
function persist(){try{localStorage.setItem(LS,JSON.stringify({done:S.done,custom:S.custom,hidden:S.hidden,focus:S.focus,ai:S.ai}))}catch(e){toast("Could not save on this device")}}
const key=(c,p)=>c+"_"+p;
const isDone=(c,p,id)=>!!(S.done[key(c,p)]&&S.done[key(c,p)].ids&&S.done[key(c,p)].ids[id]);
const vis=t=>!S.hidden[t.id];
const all=c=>TPL[c].concat(S.custom.filter(x=>x.cad===c).map(x=>({id:x.id,t:x.t,m:x.m,day:x.day,wk:x.wk||1,from:x.from}))).filter(vis);
const dailyFor=p=>all("daily").filter(t=>!t.from||t.from<=p);
const onceFor=()=>{const l=S.custom.filter(x=>x.cad==="once"&&x.due<=TODAY&&vis(x)&&!isDone("once","all",x.id)).sort((a,b)=>(a.ord||0)-(b.ord||0));const seen={};return l.filter(x=>{if(!x.proj)return true;if(seen[x.proj])return false;seen[x.proj]=1;return true}).map(x=>({id:x.id,t:x.t,m:x.m,sub:x.pt}))};
function todayList(){
 const l=dailyFor(TODAY).map(t=>["daily",TODAY,t]);
 all("weekly").filter(t=>t.day===now.getDay()).forEach(t=>l.push(["weekly",WEEK,t]));
 onceFor().forEach(t=>l.push(["once","all",t]));
 return l}
function toast(m){S.toast=m;render(true);setTimeout(()=>{S.toast="";render(true)},2500)}
function saveDoc(){persist()}
function toggle(c,p,id){
 if(!S.can)return;
 const k=key(c,p),cur=S.done[k]||{c,p,ids:{}};
 const ids=Object.assign({},cur.ids);ids[id]=!ids[id];
 const nd=Object.assign({},cur,{c,p,ids});S.done[k]=nd;render(true);
 saveDoc("done/"+k,nd)}
function setNote(v){
 const k=key("daily",TODAY),cur=S.done[k]||{c:"daily",p:TODAY,ids:{}};
 if((cur.note||"")===v)return;
 const nd=Object.assign({},cur,{note:v});S.done[k]=nd;saveDoc("done/"+k,nd)}
function setFocus(v){S.focus[MO]=v;saveDoc("focus/"+MO,{text:v})}
function hideTask(id){S.hidden[id]=true;render(true);saveDoc("settings/main",{hidden:S.hidden})}
function restoreAll(){S.hidden={};render(true);saveDoc("settings/main",{hidden:{}})}
function addTask(){
 const t=$("#nt").value.trim();if(!t){return}
 const cad=$("#nc").value,m=parseInt($("#nm").value)||null,day=parseInt($("#nd").value);
 const o={t,cad,m,from:TODAY,ts:Date.now()};S.stTitle="";
 if(cad==="weekly")o.day=day;if(cad==="once")o.due=TODAY;if(cad==="monthly")o.wk=WOM;
 S.adding=false;
 S.custom.push(Object.assign({id:"l"+Date.now()},o));persist();render(true)}
const PROMPT=t=>"Break this task into small concrete steps for someone who finds big tasks overwhelming. Task: \""+t.replace(/"/g,"'")+"\". Context: marketing and operations for a Qur'an and Arabic education centre. Rules: 3 to 7 steps in the order they should be done, each one action that can be started immediately, beginning with a verb, under 12 words, each producing something concrete. Estimate minutes for each (5 to 60). Reply with only a JSON array like [{\"t\":\"step\",\"m\":10}] and nothing else.";
function parseSteps(txt){
 let a=null;const m=txt.match(/\[[\s\S]*\]/);
 if(m){try{a=JSON.parse(m[0])}catch(e){}}
 if(!a){a=txt.split("\n").map(l=>l.replace(/^\s*(\d+[.)]|[-*\u2022])\s*/,"").trim()).filter(l=>l.length>3).map(l=>{const mm=l.match(/\((\d+)\s*min/i);return{t:l.replace(/\s*\(.*min.*\)\s*$/i,""),m:mm?+mm[1]:null}})}
 return (a||[]).map(x=>typeof x==="string"?{t:x}:x).filter(x=>x&&x.t).slice(0,8).map(x=>({t:String(x.t).slice(0,120),m:parseInt(x.m)||null,on:true}))}
async function askAI(prompt){
 const a=S.ai;
 if(a.p==="anthropic"){
  const r=await fetch(a.u||"https://api.anthropic.com/v1/messages",{method:"POST",headers:{"content-type":"application/json","x-api-key":a.k,"anthropic-version":"2023-06-01","anthropic-dangerous-direct-browser-access":"true"},body:JSON.stringify({model:a.m,max_tokens:800,messages:[{role:"user",content:prompt}]})});
  const j=await r.json();if(!r.ok)throw 0;return (j.content||[]).map(c=>c.text||"").join("")}
 const r=await fetch(a.u||"https://api.openai.com/v1/chat/completions",{method:"POST",headers:{"content-type":"application/json","authorization":"Bearer "+a.k},body:JSON.stringify({model:a.m,messages:[{role:"user",content:prompt}]})});
 const j=await r.json();if(!r.ok)throw 0;return j.choices[0].message.content}
async function splitTask(){
 const t=$("#nt").value.trim();if(!t){toast("Type the big task first");return}
 S.stTitle=t;
 if(S.ai.p==="paste"||!S.ai.k){S.paste=true;S.pr=PROMPT(t);S.pt="";render(true);return}
 S.splitting=true;render(true);
 try{const s=parseSteps(await askAI(PROMPT(t)));if(!s.length)throw 0;S.steps=s}
 catch(e){toast("The AI service did not respond. Check Settings, or use paste mode.")}
 S.splitting=false;render(true)}
function usePaste(){const v=$("#pt").value;S.pt=v;const s=parseSteps(v);if(!s.length){toast("Could not read steps from that. Ask the AI for a numbered list.");return}S.steps=s;S.paste=false;render(true)}
function copyText(t,btn){
 const ok=()=>{if(btn)btn.textContent="Copied"};
 function fb(){const x=document.createElement("textarea");x.value=t;document.body.appendChild(x);x.select();try{document.execCommand("copy");ok()}catch(e){}x.remove()}
 if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(t).then(ok,fb)}else fb()}
function exportData(){const b=new Blob([JSON.stringify({done:S.done,custom:S.custom,hidden:S.hidden,focus:S.focus})],{type:"application/json"});const a=document.createElement("a");a.href=URL.createObjectURL(b);a.download="aliyatul-plan-backup-"+TODAY+".json";document.body.appendChild(a);a.click();a.remove()}
function importData(f){if(!f)return;const r=new FileReader();r.onload=()=>{try{const o=JSON.parse(r.result);["done","custom","hidden","focus"].forEach(k=>{if(o[k])S[k]=o[k]});persist();toast("Backup restored")}catch(e){toast("That file could not be read")}};r.readAsText(f)}
function reportText(M){
 const mo=all("monthly"),wk=all("weekly");
 let s="Aliyatul Quran marketing report: "+mlabel(M)+"\n\nFocus: "+(S.focus[M]||"not written yet")+"\n\nMonthly tasks:\n";
 mo.forEach(t=>{s+=(isDone("monthly",M,t.id)?"[x] ":"[ ] ")+t.t+"\n"});
 s+="\nWeekly tasks completed:\n";
 const wd=[...new Set(Object.values(S.done).filter(d=>d.c==="weekly"&&d.p.slice(0,7)===M).map(d=>d.p))].sort();
 wd.forEach(p=>{const dt=new Date(p+"T00:00:00");s+="Week of "+dt.getDate()+" "+MONTHS[dt.getMonth()]+": "+wk.filter(t=>isDone("weekly",p,t.id)).length+" of "+wk.length+"\n"});
 if(!wd.length)s+="None yet\n";
 const g={};S.custom.filter(x=>x.proj).forEach(x=>{(g[x.proj]=g[x.proj]||{t:x.pt,a:0,b:0}).b++;if(isDone("once","all",x.id))g[x.proj].a++});
 const gl=Object.values(g);
 if(gl.length){s+="\nBigger tasks:\n";gl.forEach(x=>{s+=x.t+": "+x.a+" of "+x.b+" steps\n"})}
 const notes=Object.values(S.done).filter(d=>d.c==="daily"&&d.p.slice(0,7)===M&&d.note&&d.note.trim()).sort((a,b)=>a.p<b.p?-1:1);
 s+="\nDaily notes:\n";notes.forEach(d=>{s+=(+d.p.slice(8))+" "+MONTHS[+M.slice(5)-1].slice(0,3)+": "+d.note.trim()+"\n"});
 if(!notes.length)s+="None\n";
 return s}
function vSettings(){const a=S.ai;
 return `<h1>Settings</h1><p class="sub">Everything is saved on this device only.</p>
 <h2>BREAKING BIG TASKS INTO STEPS</h2><div class="card" style="padding:10px 12px">
 <select id="ap"><option value="paste" ${a.p==="paste"?"selected":""}>Paste mode (any AI, no key needed)</option><option value="openai" ${a.p==="openai"?"selected":""}>OpenAI-compatible service</option><option value="anthropic" ${a.p==="anthropic"?"selected":""}>Anthropic</option></select>
 <input type="text" id="au" placeholder="Endpoint URL (optional)" value="${esc(a.u)}">
 <input type="text" id="am" placeholder="Model name" value="${esc(a.m)}">
 <input type="password" id="ak" placeholder="API key" value="${esc(a.k)}" autocomplete="off">
 <p class="sub">Paste mode needs nothing: you copy a request into any AI chat and paste the reply back. Direct mode needs a key from your AI provider. OpenAI-compatible covers OpenAI, Gemini, Mistral, Groq, OpenRouter and local tools. The key stays on this device.</p>
 <button class="btn" data-act="saveai">Save</button></div>
 <h2>BACKUP</h2><div class="card" style="padding:10px 12px"><p class="sub">Keep a copy, or move your plan to another device.</p>
 <button class="btn alt" data-act="export">Download backup</button><button class="btn alt" data-act="import" style="margin-top:8px">Restore from backup</button><input type="file" id="imp" accept=".json" hidden></div>`}
function saveSteps(){
 const pid="p"+Date.now(),list=S.steps.filter(x=>x.on),title=S.stTitle;
 S.adding=false;S.steps=null;S.stTitle="";
 for(let i=0;i<list.length;i++){
  const o={t:list[i].t,m:list[i].m,cad:"once",due:TODAY,from:TODAY,ts:Date.now()+i,proj:pid,pt:title,ord:i};
  S.custom.push(Object.assign({id:"l"+pid+i},o));
 }
 persist();render(true)}
const row=(c,p,t)=>{const d=isDone(c,p,t.id);
 return `<label class="row ${d?"d":""}"><input type="checkbox" data-t="${c}|${p}|${t.id}" ${d?"checked":""} ${S.can?"":"disabled"}><span class="tx">${esc(t.t)}${(t.m||t.sub)?`<small>${t.sub?"Part of: "+esc(t.sub)+(t.m?", ":""):""}${t.m?t.m+" min":""}</small>`:""}</span>${S.edit?`<button class="x" data-hide="${esc(t.id)}">Remove</button>`:""}</label>`};
const bar=(a,b,label)=>`<div class="bar"><i style="width:${b?Math.round(a/b*100):0}%"></i></div><div class="prog"><span>${label}</span><span>${a} of ${b}</span></div>`;

function vToday(){
 const l=todayList(),n=l.filter(x=>isDone(x[0],x[1],x[2].id)).length;
 const k=key("daily",TODAY),note=(S.done[k]&&S.done[k].note)||"";
 if(S.one){
  const next=l.find(x=>!isDone(x[0],x[1],x[2].id)&&!S.skip[x[2].id]);
  if(!next)return `<div class="focus"><div class="big">Nothing left for now</div><p>That is enough for today.</p><button class="btn alt" data-act="back">Back to the list</button></div>`;
  const t=next[2];
  return `<div class="focus"><p>Just this one thing</p><div class="big">${esc(t.t)}</div><p>${t.m?`About ${t.m} minutes. `:""}Starting for five minutes counts.</p>
  <button class="btn" data-one="${next[0]}|${next[1]}|${t.id}">Done</button>
  <button class="btn alt" data-skip="${t.id}">Not now, show another</button>
  <button class="link" data-act="back">Back to the list</button></div>`}
 const first=n===0&&l.length?"Start small. Pick any one.":"";
 return `<h1>${DAYS[now.getDay()]}, ${now.getDate()} ${MONTHS[now.getMonth()]}</h1>
 <p class="sub">${first||"Only today's tasks are shown. Everything else can wait."}</p>
 ${bar(n,l.length,"Today")}
 ${l.length&&n<l.length?`<button class="btn" style="margin:12px 0" data-act="one">Show me just one thing</button>`:""}
 <h2>TODAY</h2><div class="card">${l.length?l.map(x=>row(x[0],x[1],x[2])).join(""):`<div class="empty">Nothing planned today. Rest is part of the plan.</div>`}</div>
 <h2>ONE LINE FOR THE OWNER</h2><div class="card" style="padding:8px 12px"><textarea id="note" placeholder="What did you move forward today?" ${S.can?"":"disabled"}>${esc(note)}</textarea></div>
 ${editBar()}`}

function editBar(){const h=Object.keys(S.hidden).length;
 return `<div style="margin-top:6px"><button class="link" data-act="edit">${S.edit?"Done editing list":"Edit my list"}</button>${S.edit&&h?` <button class="link" data-act="restore">Restore ${h} removed</button>`:""}</div>`}

function vWeek(){
 const w=all("weekly"),n=w.filter(t=>isDone("weekly",WEEK,t.id)).length;
 const ws=new Date(now);ws.setDate(now.getDate()-now.getDay());
 let h=`<h1>This week</h1><p class="sub">Week of ${ws.getDate()} ${MONTHS[ws.getMonth()]}. Each task has a suggested day. Do them on any day that works.</p>${bar(n,w.length,"Weekly tasks")}`;
 for(let d=0;d<7;d++){const l=w.filter(t=>t.day===d);if(!l.length)continue;
  h+=`<h2>${DAYS[d].toUpperCase()}${d===now.getDay()?" (TODAY)":""}</h2><div class="card">${l.map(t=>row("weekly",WEEK,t)).join("")}</div>`}
 const mm=all("monthly").filter(t=>t.wk===WOM);
 if(mm.length)h+=`<h2>MONTHLY TASKS SUGGESTED THIS WEEK</h2><div class="card">${mm.map(t=>row("monthly",MO,t)).join("")}</div>`;
 return h+editBar()}

function vMonth(){
 const m=all("monthly"),n=m.filter(t=>isDone("monthly",MO,t.id)).length;
 let h=`<h1>${mlabel(MO)}</h1><p class="sub">The bigger tasks, spread across the month.</p>
 <h2>WHAT I AM WORKING TOWARDS THIS MONTH</h2><div class="card" style="padding:8px 12px"><textarea id="focus" placeholder="Write one or two lines. The owner will see this." ${S.can?"":"disabled"}>${esc(S.focus[MO]||"")}</textarea></div>
 ${bar(n,m.length,"Monthly tasks")}`;
 for(let w=1;w<=4;w++){const l=m.filter(t=>t.wk===w);if(!l.length)continue;
  h+=`<h2>WEEK ${w}${w===WOM?" (THIS WEEK)":""}</h2><div class="card">${l.map(t=>row("monthly",MO,t)).join("")}</div>`}
 return h+editBar()}

function vOwner(){
 const M=S.vm,mo=all("monthly"),mn=mo.filter(t=>isDone("monthly",M,t.id));
 const wk=all("weekly");
 const wdocs=Object.values(S.done).filter(d=>d.c==="weekly"&&d.p.slice(0,7)===M).map(d=>d.p);
 if(M===MO&&wdocs.indexOf(WEEK)<0)wdocs.push(WEEK);
 wdocs.sort();
 const ddocs=Object.values(S.done).filter(d=>d.c==="daily"&&d.p.slice(0,7)===M).sort((a,b)=>a.p<b.p?1:-1);
 const dTicks=ddocs.reduce((a,d)=>a+Object.keys(d.ids||{}).filter(i=>d.ids[i]).length,0);
 const worked=ddocs.filter(d=>Object.keys(d.ids||{}).some(i=>d.ids[i])).length;
 const notes=ddocs.filter(d=>d.note&&d.note.trim());
 let wtot=0,wdone=0;
 const wrows=wdocs.map(p=>{const a=wk.filter(t=>isDone("weekly",p,t.id)).length;wtot+=wk.length;wdone+=a;
  const dt=new Date(p+"T00:00:00");return `<div class="stat"><span>Week of ${dt.getDate()} ${MONTHS[dt.getMonth()]}</span><b>${a} of ${wk.length}</b></div>`}).join("");
 const mi=MONTHS.indexOf(mlabel(M).split(" ")[0]);
 return `<h1>Progress report</h1><p class="sub">Send this to the owner. Copy the report text, or share it straight to WhatsApp.</p>
 <div class="nav"><button data-nav="-1">Previous</button><b>${mlabel(M)}</b><button data-nav="1" ${M>=MO?"disabled":""}>Next</button></div>
 <button class="btn" data-act="copyrep">Copy report</button><button class="btn alt" data-act="sharerep" style="margin-top:8px">Share report</button>
 <h2>FOCUS THIS MONTH</h2><div class="card"><div class="empty" style="color:var(--ink)">${esc(S.focus[M]||"No focus written yet.")}</div></div>
 <h2>SUMMARY</h2><div class="card">
 <div class="stat"><span>Monthly tasks completed</span><b>${mn.length} of ${mo.length}</b></div>
 <div class="stat"><span>Weekly tasks completed</span><b>${wdone} of ${wtot}</b></div>
 <div class="stat"><span>Days worked on daily tasks</span><b>${worked}</b></div>
 <div class="stat"><span>Daily tasks completed</span><b>${dTicks}</b></div></div>
 ${(()=>{const g={};S.custom.filter(x=>x.proj).forEach(x=>{(g[x.proj]=g[x.proj]||{t:x.pt,a:0,b:0}).b++;if(isDone("once","all",x.id))g[x.proj].a++});const l=Object.values(g);return l.length?`<h2>BIGGER TASKS BROKEN INTO STEPS</h2><div class="card">${l.map(x=>`<div class="stat"><span>${esc(x.t)}</span><b>${x.a} of ${x.b} steps</b></div>`).join("")}</div>`:""})()}
 <h2>MONTHLY TASKS</h2><div class="card">${mo.map(t=>`<div class="stat"><span>${esc(t.t)}</span><b>${isDone("monthly",M,t.id)?"Done":"Open"}</b></div>`).join("")||`<div class="empty">None</div>`}</div>
 <h2>BY WEEK</h2><div class="card">${wrows||`<div class="empty">No weeks recorded yet.</div>`}</div>
 <h2>DAILY NOTES</h2><div class="card">${notes.map(d=>`<div class="log"><b>${+d.p.slice(8)} ${MONTHS[mi].slice(0,3)}</b>${esc(d.note)}</div>`).join("")||`<div class="empty">No notes yet.</div>`}</div>`}

function vAdd(){
 if(S.paste)return `<div class="card" style="padding:14px 12px;border:2px solid var(--acc)"><b>${esc(S.stTitle)}</b><p class="sub">1. Copy this request and paste it into any AI (ChatGPT, Claude, Gemini or another).<br>2. Paste its reply below.</p><textarea id="pr" readonly>${esc(S.pr)}</textarea><button class="btn alt" data-act="copyprompt">Copy request</button><textarea id="pt" placeholder="Paste the AI reply here" style="margin-top:8px">${esc(S.pt)}</textarea><button class="btn" data-act="usepaste">Make my steps</button><button class="link" data-act="cancel">Cancel</button></div>`;
 if(S.steps)return `<div class="card" style="padding:14px 12px;border:2px solid var(--acc)"><b>${esc(S.stTitle)}</b><p class="sub">Here are the small steps. Untick any you do not need. Only one step shows on Today at a time.</p>${S.steps.map((x,i)=>`<label class="row"><input type="checkbox" data-st="${i}" ${x.on?"checked":""}><span class="tx">${esc(x.t)}${x.m?`<small>${x.m} min</small>`:""}</span></label>`).join("")}<button class="btn" data-act="savesteps" style="margin-top:10px">Add these steps</button><button class="link" data-act="cancel">Cancel</button></div>`;
 return `<div class="card" style="padding:14px 12px;border:2px solid var(--acc)"><b>Add a task</b>
 <input type="text" id="nt" placeholder="What needs doing?">
 <select id="nc"><option value="once">Just today</option><option value="daily">Every day</option><option value="weekly">Every week</option><option value="monthly">Every month</option></select>
 <select id="nd">${DAYS.map((d,i)=>`<option value="${i}" ${i===now.getDay()?"selected":""}>${d} (if weekly)</option>`).join("")}</select>
 <input type="text" id="nm" placeholder="Minutes it takes (optional)" inputmode="numeric">
 <button class="btn" data-act="save">Add task</button><button class="btn alt" data-act="split" style="margin-top:8px" ${S.splitting?"disabled":""}>${S.splitting?"Breaking it down...":"Break it down into steps"}</button><p class="sub" style="margin:8px 0 0">For a big task, type it above and tap Break it down. It becomes small steps, shown one at a time.</p><button class="link" data-act="cancel">Cancel</button></div>`}

function render(force){
 const a=document.activeElement;
 if(!force&&a&&(a.tagName==="TEXTAREA"||a.tagName==="INPUT")){S.pending=true;return}
 S.pending=false;
 const T=[["today","Today"],["week","Week"],["month","Month"],["owner","Report"],["set","Settings"]];
 let h="";
 h+=`<div class="tabs">${T.map(t=>`<button class="${S.tab===t[0]?"on":""}" data-tab="${t[0]}">${t[1]}</button>`).join("")}</div>`;
 h+=({today:vToday,week:vWeek,month:vMonth,owner:vOwner,set:vSettings})[S.tab]();
 if(S.adding)h+=vAdd();
 if(S.can&&!S.adding&&!S.one&&S.tab!=="owner"&&S.tab!=="set")h+=`<button class="fab" data-act="add">+ Add a task</button>`;
 if(S.toast)h+=`<div class="toast">${esc(S.toast)}</div>`;
 $("#app").innerHTML=h;
 if(S.adding){const e=$("#nt");if(e){if(S.stTitle)e.value=S.stTitle;if(!e.dataset.f){e.dataset.f=1;e.focus()}}}}

document.addEventListener("click",e=>{
 const b=e.target.closest("[data-tab],[data-act],[data-one],[data-skip],[data-hide],[data-nav]");
 if(b){const d=b.dataset;
  if(d.tab){S.tab=d.tab;S.one=false;S.adding=false;render(true);window.scrollTo(0,0)}
  else if(d.one){const p=d.one.split("|");toggle(p[0],p[1],p[2])}
  else if(d.skip){S.skip[d.skip]=true;render(true)}
  else if(d.hide){hideTask(d.hide)}
  else if(d.nav){const[y,m]=S.vm.split("-").map(Number);const dt=new Date(y,m-1+Number(d.nav),1);const nv=dt.getFullYear()+"-"+pad(dt.getMonth()+1);if(nv<=MO){S.vm=nv;render(true)}}
  else if(d.act==="one"){S.one=true;S.skip={};render(true)}
  else if(d.act==="back"){S.one=false;render(true)}
  else if(d.act==="edit"){S.edit=!S.edit;render(true)}
  else if(d.act==="restore"){restoreAll()}
  else if(d.act==="add"){S.adding=true;render(true);window.scrollTo(0,document.body.scrollHeight)}
  else if(d.act==="cancel"){S.adding=false;S.steps=null;S.stTitle="";S.paste=false;S.pt="";render(true)}
  else if(d.act==="split"){splitTask()}
  else if(d.act==="savesteps"){saveSteps()}
  else if(d.act==="copyprompt"){copyText(S.pr,b)}
  else if(d.act==="usepaste"){usePaste()}
  else if(d.act==="copyrep"){copyText(reportText(S.vm),b)}
  else if(d.act==="sharerep"){const t=reportText(S.vm);if(navigator.share){navigator.share({text:t}).catch(()=>{})}else copyText(t,b)}
  else if(d.act==="saveai"){S.ai={p:$("#ap").value,u:$("#au").value.trim(),m:$("#am").value.trim(),k:$("#ak").value.trim()};persist();toast("Saved")}
  else if(d.act==="export"){exportData()}
  else if(d.act==="import"){$("#imp").click()}
  else if(d.act==="save"){addTask()}
 }});
document.addEventListener("change",e=>{
 const t=e.target;if(t.id==="imp"){importData(t.files[0]);return}if(t.dataset&&t.dataset.st!==undefined&&S.steps){S.steps[+t.dataset.st].on=t.checked;return}if(t.dataset&&t.dataset.t){const p=t.dataset.t.split("|");toggle(p[0],p[1],p[2])}});
document.addEventListener("focusout",e=>{
 const t=e.target;
 if(t.id==="note")setNote(t.value);
 if(t.id==="focus")setFocus(t.value);
 setTimeout(()=>{if(S.pending)render(true)},50)});

load();render(true);
</script></body></html>
